name: Release

# Run manually: Actions -> Release -> Run workflow (branch main).
# Builds the APK signed with the release key, verifies it and publishes a GitHub release
# tagged v<versionName> (e.g. v18.5-beta.1-fork.7930). The in-app updater only installs
# releases from this repository that are signed with the same key.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Signed release APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # create the tag and the GitHub release

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dkotlin.daemon.jvm.options=-Xmx2048m"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: versionCode = commit count

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true # a release never reuses build output written by other branches

      - name: Decode release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 is not set - see docs/FORK_RELEASE.md."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify signature and prepare release files
        id: apk
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::No signed APK was built (check the RELEASE_* secrets)."
            exit 1
          fi
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" > certs.txt
          CERT_SHA256=$(grep -m1 'certificate SHA-256 digest' certs.txt | awk '{print $NF}')
          VERSION_NAME=$("$BUILD_TOOLS/aapt2" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          VERSION_CODE=$("$BUILD_TOOLS/aapt2" dump badging "$APK" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          case "$VERSION_NAME" in
            *-fork.[0-9]*) ;;
            *) echo "::error::Unexpected versionName '$VERSION_NAME'"; exit 1 ;;
          esac
          FILE="essentials-$VERSION_NAME.apk"
          mv "$APK" "$FILE"
          sha256sum "$FILE" > "$FILE.sha256"
          {
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "cert_sha256=$CERT_SHA256"
            echo "file=$FILE"
          } >> "$GITHUB_OUTPUT"
          echo "Built $FILE (versionCode $VERSION_CODE), signing certificate SHA-256 $CERT_SHA256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.apk.outputs.version_name }}
          VERSION_CODE: ${{ steps.apk.outputs.version_code }}
          CERT_SHA256: ${{ steps.apk.outputs.cert_sha256 }}
          FILE: ${{ steps.apk.outputs.file }}
        run: |
          TAG="v$VERSION_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists - push a new commit first."
            exit 1
          fi
          {
            echo "Build of \`${GITHUB_SHA::12}\` (versionCode $VERSION_CODE)."
            echo
            echo "**Signing certificate SHA-256:** \`$CERT_SHA256\`"
            echo
            echo "**APK SHA-256:** \`$(cut -d' ' -f1 "$FILE.sha256")\`"
            echo
            echo "### Changes"
            PREVIOUS=$(git describe --tags --abbrev=0 --match 'v*-fork.*' 2>/dev/null || true)
            if [ -n "$PREVIOUS" ]; then
              git log --no-merges --format='- %s' "$PREVIOUS..HEAD" | head -n 60
            else
              git log --no-merges --format='- %s' -n 30
            fi
          } > notes.md
          gh release create "$TAG" "$FILE" "$FILE.sha256" \
            --target "$GITHUB_SHA" \
            --title "Essentials $VERSION_NAME" \
            --notes-file notes.md
