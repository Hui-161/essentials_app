name: Build

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Debug APK and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # GitHub runners have 7 GB RAM: limit Gradle and Kotlin daemons
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dkotlin.daemon.jvm.options=-Xmx2048m"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: versionCode = commit count

      # Matches gradle/gradle-daemon-jvm.properties (Amazon Corretto 21)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      # Also validates gradle-wrapper.jar against the official Gradle checksums
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode dev signing key
        env:
          DEV_KEYSTORE_BASE64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEV_KEYSTORE_BASE64" ]; then
            mkdir -p app/signing
            echo "$DEV_KEYSTORE_BASE64" | base64 --decode > app/signing/dev.keystore
            echo "Using the fixed dev signing key (debug APKs install as updates)."
          else
            echo "::warning::Secret DEV_KEYSTORE_BASE64 is not set - this debug APK cannot update a previously installed debug build."
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: essentials-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # After the upload, so a slow or failing test run never blocks the APK
      - name: Run unit tests
        timeout-minutes: 20
        run: ./gradlew testDebugUnitTest --stacktrace
